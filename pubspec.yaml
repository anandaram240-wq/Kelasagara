name: kelasagaara
description: KelasaGaara v16 - ಕೆಲಸಗಾರ - Karnataka Informal Worker Job Marketplace
publish_to: 'none'
version: 21.6.8+2168

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase ─────────────────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.1.3       # HTTPS Callable for server-side biometric processing
  firebase_storage: ^12.3.1
  firebase_messaging: ^15.1.3
  firebase_database: ^11.0.5          # RTDB — live GPS transport
  package_info_plus: ^8.0.0          # Runtime build number for update check

  # ── Background Location ───────────────────────────────────
  flutter_foreground_task: ^8.12.0    # Android foreground service for GPS

  # ── Auth ─────────────────────────────────────────────────────
  google_sign_in: ^6.2.2

  # ── Face Auth (ML Kit — WORKS on any Android) ────────────────
  google_mlkit_face_detection: ^0.13.0
  camera: ^0.11.0+2

  # ── Maps + Location ──────────────────────────────────────────
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2

  # ── Voice / AI ───────────────────────────────────────────────
  speech_to_text: ^7.0.0
  flutter_tts: ^4.1.0

  # ── UI / Animations ──────────────────────────────────────────
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  animations: ^2.0.11
  lottie: ^3.1.2

  # ── State Management ─────────────────────────────────────────
  provider: ^6.1.2

  # ── Utilities ────────────────────────────────────────────────
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  timeago: ^3.7.0
  connectivity_plus: ^6.1.0
  url_launcher: ^6.3.1
  intl: ^0.19.0
  pin_code_fields: ^8.0.1
  path_provider: ^2.1.4
  crypto: ^3.0.3
  dio: ^5.7.0
  http: ^1.2.2
  ffi: ^2.1.3
  image: ^4.2.0

  cupertino_icons: ^1.0.8
  cryptography: ^2.9.0
  screen_brightness: ^2.1.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/models/
  shaders:
    - shaders/siri_fluid_orb.frag
